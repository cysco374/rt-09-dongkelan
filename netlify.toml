[build]
  command = "pnpm install --frozen-lockfile && cd src/frontend && pnpm build:skip-bindings"
  publish = "src/frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/rpc"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
